<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menü - Deer Valley Palm Beach</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            scroll-behavior: smooth;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Üst Header / Navigasyon */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .back-home {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }
        .back-home:hover {
            color: #fff;
        }
        .brand-title {
            font-size: 13px;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
        }

        /* Menü Başlık Alanı */
        .menu-hero {
            padding: 140px 20px 40px 20px;
            text-align: center;
        }
        .menu-hero h1 {
            font-size: 38px;
            letter-spacing: 3px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .menu-hero p {
            color: #aaa;
            font-size: 15px;
        }

        /* Yeni Nesil Yatay Kaydırılabilir Kategori Sekmeleri */
        .category-nav-wrapper {
            position: sticky;
            top: 71px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            z-index: 999;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 40px;
        }
        .category-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
            padding: 0 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .category-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }
        .cat-btn {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .cat-btn:hover {
            background: #252525;
            color: #fff;
            border-color: rgba(255,255,255,0.3);
        }
        .cat-btn.active {
            background: #ffffff;
            color: #121212;
            border-color: #ffffff;
            font-weight: 600;
        }

        /* Menü İçerik Alanı */
        .menu-content {
            padding-bottom: 100px;
        }
        .menu-category-section {
            margin-bottom: 50px;
        }
        .menu-category-title {
            font-size: 20px;
            letter-spacing: 1.5px;
            color: #dfdfdf;
            margin-bottom: 25px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-transform: uppercase;
        }

        /* Ürün Kartları / Listesi */
        .menu-items-grid {
            display: grid;
            gap: 20px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            background: #171717;
            padding: 18px 22px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: border-color 0.3s;
        }
        .menu-item:hover {
            border-color: rgba(255,255,255,0.15);
        }
        .item-info {
            max-width: 75%;
        }
        .item-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }
        .item-desc {
            font-size: 13px;
            color: #999;
            line-height: 1.4;
        }
        .item-price {
            font-size: 16px;
            font-weight: 600;
            color: #dfdfdf;
        }

        /* Mobil Uyum */
        @media (max-width: 768px) {
            header { padding: 12px 20px; }
            .brand-title { display: none; }
            .menu-hero { padding-top: 120px; }
            .menu-hero h1 { font-size: 28px; }
            .category-container { padding: 0 15px; }
        }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <header>
        <a href="index.html" class="back-home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Ana Sayfa
        </a>
        <div class="brand-title">Deer Valley Palm Beach</div>
    </header>

    <!-- Başlık -->
    <section class="menu-hero">
        <h1>MENÜ</h1>
        <p>Deniz kenarında, gün batımı eşliğinde hazırlanan lezzetler</p>
    </section>

    <!-- Modern Yatay Kategori Navigasyonu -->
    <div class="category-nav-wrapper">
        <div class="category-container" id="category-nav">
            <!-- Kategoriler dinamik yüklenecek -->
        </div>
    </div>

    <!-- Menü Ürünleri Listesi -->
    <div class="container menu-content" id="menu-sections-container">
        <!-- Ürünler dinamik yüklenecek -->
    </div>

    <!-- Firebase Veri Entegrasyonu -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBz2YSZx5wBCs9eM4FCqxovO4rHhqworBw",
            authDomain: "deer-valley-palm-beach.firebaseapp.com",
            databaseURL: "https://deer-valley-palm-beach-default-rtdb.firebaseio.com",
            projectId: "deer-valley-palm-beach",
            storageBucket: "deer-valley-palm-beach.firebasestorage.app",
            messagingSenderId: "1044470367747",
            appId: "1:1044470367747:web:b18af2195cf35c3856f036",
            measurementId: "G-1MNYDFTSRJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        async function loadMenu() {
            try {
                const snapshot = await get(ref(db, 'menu'));
                if (snapshot.exists()) {
                    const menuData = snapshot.val();
                    renderMenu(menuData);
                } else {
                    document.getElementById('menu-sections-container').innerHTML = '<p style="text-align:center; color:#777;">Henüz menü içeriği eklenmemiş.</p>';
                }
            } catch (error) {
                console.error("Menü yüklenirken hata oluştu:", error);
            }
        }

        function renderMenu(data) {
            const navContainer = document.getElementById('category-nav');
            const contentContainer = document.getElementById('menu-sections-container');
            
            navContainer.innerHTML = '';
            contentContainer.innerHTML = '';

            let isFirst = true;

            // data bir obje veya dizi olabilir, yapınıza göre uyarlanmıştır
            Object.keys(data).forEach(catKey => {
                const category = data[catKey];
                const catId = `cat-${catKey}`;
                
                // Kategori Nav Butonu Oluşturma
                const btn = document.createElement('button');
                btn.className = `cat-btn ${isFirst ? 'active' : ''}`;
                btn.textContent = category.name || catKey;
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(catId).scrollIntoView({ behavior: 'smooth', block: 'start' });
                };
                navContainer.appendChild(btn);

                // Kategori Bölümü ve Ürünler
                const section = document.createElement('div');
                section.className = 'menu-category-section';
                section.id = catId;

                let itemsHtml = `<h2 class="menu-category-title">${category.name || catKey}</h2><div class="menu-items-grid">`;
                
                if (category.items) {
                    Object.values(category.items).forEach(item => {
                        itemsHtml += `
                            <div class="menu-item">
                                <div class="item-info">
                                    <div class="item-name">${item.name}</div>
                                    ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
                                </div>
                                <div class="item-price">₺${item.price}</div>
                            </div>
                        `;
                    });
                }
                itemsHtml += `</div>`;
                section.innerHTML = itemsHtml;
                contentContainer.appendChild(section);

                isFirst = false;
            });
        }

        loadMenu();
    </script>
</body>
</html>
