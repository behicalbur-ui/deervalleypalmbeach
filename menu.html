<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menü | Deer Valley Palm Beach</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
        }

        .back-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ccc;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }
        .back-link:hover { color: #fff; }
        .back-bar .brand { font-size: 11px; letter-spacing: 3px; color: #c9a876; }

        .menu-hero {
            padding: 70px 24px 40px;
            text-align: center;
            background: linear-gradient(180deg, #1a1512 0%, #0f0f0f 100%);
        }
        .menu-hero .eyebrow { font-size: 11px; letter-spacing: 4px; color: #c9a876; margin-bottom: 16px; text-transform: uppercase; }
        .menu-hero h1 { font-size: 38px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
        .menu-hero p { font-size: 14px; color: #999; letter-spacing: 0.5px; }
        .gold-divider { width: 44px; height: 1px; background: #c9a876; margin: 24px auto; }

        .menu-content { max-width: 720px; margin: 0 auto; padding: 20px 24px 100px; }

        .menu-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 50px;
            position: sticky;
            top: 55px; /* back-bar yüksekliğine göre ayarlandı */
            z-index: 90;
            background: rgba(15,15,15,0.97);
            padding: 14px 0;
        }
        .menu-nav a {
            font-size: 12px;
            letter-spacing: 1px;
            color: #999;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 30px;
            transition: all 0.25s;
            text-transform: uppercase;
        }
        .menu-nav a:hover, .menu-nav a.active { color: #0f0f0f; background: #c9a876; border-color: #c9a876; }

        .menu-category { 
            margin-bottom: 56px; 
        }
        
        .menu-category-title { font-size: 15px; letter-spacing: 4px; color: #c9a876; text-transform: uppercase; text-align: center; margin-bottom: 8px; }
        .menu-category .gold-divider { margin: 12px auto 28px; }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 20px;
            padding: 16px 0;
            border-bottom: 1px dotted rgba(255,255,255,0.12);
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item-left { flex: 1; }
        .menu-item-name { font-size: 16px; font-weight: 500; margin-bottom: 4px; letter-spacing: 0.3px; }
        .menu-item-desc { font-size: 13px; color: #888; line-height: 1.5; max-width: 420px; }
        
        .menu-item-price { font-size: 15px; color: #c9a876; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
        .old-price { font-size: 13px; color: #888; text-decoration: line-through; font-weight: 400; }

        .menu-footer {
            text-align: center;
            padding: 40px 24px 60px;
            border-top: 1px solid rgba(255,255,255,0.08);
            color: #777;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .menu-footer a { color: #c9a876; text-decoration: none; }

        @media (max-width: 600px) {
            .menu-hero h1 { font-size: 28px; }
            .menu-nav { top: 53px; }
            .menu-item { flex-direction: column; gap: 4px; }
            .menu-item-price { align-self: flex-end; }
        }
    </style>
</head>
<body>

    <div class="back-bar" id="backBar">
        <a href="index.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Ana Sayfa
        </a>
        <div class="brand">DEER VALLEY PALM BEACH</div>
    </div>

    <section class="menu-hero">
        <div class="eyebrow">Deer Valley Palm Beach</div>
        <h1>Menü</h1>
        <p>Deniz kenarında, gün batımı eşliğinde hazırlanan lezzetler</p>
        <div class="gold-divider"></div>
    </section>

    <div class="menu-content">
        <div id="menu-container"></div>
    </div>

    <div class="menu-footer">
        <p>Deer Valley Palm Beach &middot; <a href="index.html">Ana Sayfa</a></p>
    </div>

    <script>
        const STORAGE_KEY = 'deer_valley_site_data';

        const defaultMenuData = {
            categories: [
                {
                    id: "baslangiclar",
                    name: "Başlangıçlar",
                    items: [
                        { name: "Zeytinyağlı Enginar", description: "Taze otlarla servis edilen zeytinyağlı enginar.", price: 250, discountPercent: 0, active: true }
                    ]
                }
            ]
        };

        function renderMenu() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            let menuData = defaultMenuData;

            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    if (parsed && parsed.menu && parsed.menu.categories) {
                        menuData = parsed.menu;
                    }
                } catch(e) {
                    console.error("Menü verisi okunamadı:", e);
                }
            }

            let navHtml = '<nav class="menu-nav" id="menuNav">';
            let contentHtml = '';

            if (menuData.categories && menuData.categories.length > 0) {
                menuData.categories.forEach(category => {
                    const catId = category.id || 'cat-' + Math.random().toString(36).substring(2, 7);
                    navHtml += `<a href="#${catId}" class="nav-link" data-target="${catId}">${category.name}</a>`;

                    contentHtml += `
                        <div id="${catId}" class="menu-category">
                            <div class="menu-category-title">${category.name}</div>
                            <div class="gold-divider"></div>
                    `;

                    if (category.items && category.items.length > 0) {
                        category.items.forEach(item => {
                            if (item.active !== false) {
                                const originalPrice = Number(item.price) || 0;
                                const discountPercent = Number(item.discountPercent || item.discount || item.indirim || 0);
                                
                                let priceHtml = '';
                                if (discountPercent > 0) {
                                    const discountedPrice = Math.round(originalPrice * (1 - discountPercent / 100));
                                    priceHtml = `<span class="old-price">₺${originalPrice}</span> ₺${discountedPrice}`;
                                } else {
                                    priceHtml = `₺${originalPrice}`;
                                }

                                contentHtml += `
                                    <div class="menu-item">
                                        <div class="menu-item-left">
                                            <div class="menu-item-name">${item.name}</div>
                                            ${item.description ? `<div class="menu-item-desc">${item.description}</div>` : ''}
                                        </div>
                                        <div class="menu-item-price">${priceHtml}</div>
                                    </div>
                                `;
                            }
                        });
                    }

                    contentHtml += `</div>`;
                });
            } else {
                contentHtml = '<p style="text-align:center; color:#777; padding:40px;">Henüz menü içeriği eklenmemiş.</p>';
            }

            navHtml += '</nav>';
            document.getElementById('menu-container').innerHTML = navHtml + contentHtml;

            // Dinamik Kaydırma Hesaplaması (Sabit barların altında asla kalmaz)
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const targetElement = document.getElementById(targetId);
                    
                    if (targetElement) {
                        const backBarHeight = document.getElementById('backBar').offsetHeight;
                        const menuNavHeight = document.getElementById('menuNav').offsetHeight;
                        // Üstteki tüm sabit alanların toplam yüksekliği + ekstra pay
                        const totalOffset = backBarHeight + menuNavHeight + 20; 

                        const elementPosition = targetElement.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - totalOffset;

                        window.scrollTo({
                            top: offsetPosition,
                            behavior: 'smooth'
                        });

                        // Aktif sınıfını güncelle
                        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                        this.classList.add('active');
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', renderMenu);
    </script>
</body>
</html>
