<!-- 
  ================================================================
  INSTAGRAM FEED BÖLÜMÜ — Sadece link ile (resmi embed)
  ================================================================
  Nasıl güncellenir:
  1) Instagram'da göstermek istediğin gönderiye git.
  2) Gönderinin altındaki "..." (üç nokta) menüsüne tıkla.
  3) "Bağlantıyı kopyala" seçeneğini seç.
     (Link şuna benzer: https://www.instagram.com/p/AbCdEfGh123/)
  4) Aşağıdaki POST_LINKS listesine o linki ekle.
  5) Kaydet — Instagram görseli, açıklamayı ve beğeni sayısını
     kendi sunucusundan otomatik çekip gösterecek.
  En yeni gönderiyi listenin EN ÜSTÜNE ekle.
  Not: Bu resmi Instagram embed özelliğidir — ücretsizdir, reklam
  içermez, hesaba giriş gerektirmez. Kartların görünümü (beyaz,
  standart Instagram kartı) Instagram tarafından belirlenir.
  ================================================================
-->
<section class="ig-feed">
  <div class="ig-feed__glow" aria-hidden="true"></div>

  <header class="ig-feed__header">
    <div class="ig-feed__id">
      <img class="ig-feed__avatar" src="images/avatar.jpg" alt="Palm Beach profil fotoğrafı" />
      <div class="ig-feed__id-text">
        <span class="ig-feed__name">Palm Beach</span>
        <span class="ig-feed__handle">@deervalleypalmbeach</span>
      </div>
    </div>
    <a class="ig-feed__cta" href="https://www.instagram.com/deervalleypalmbeach/" target="_blank" rel="noopener">
      Instagram'da Takip Et
    </a>
  </header>

  <p class="ig-feed__tag">Sahilden son kareler</p>

  <div class="ig-feed__grid" id="igGrid"></div>
</section>

<style>
  .ig-feed {
    --ink: #f4ecda;
    --ink-dim: #cdbfa0;
    --night: #10161a;
    --night-deep: #0a0e11;
    --gold: #cc9a44;
    --coral: #d9754a;
    --palm: #33544c;
    position: relative;
    background: var(--night-deep);
    color: var(--ink);
    padding: 4.5rem 1.5rem 5rem;
    overflow: hidden;
    font-family: 'Manrope', system-ui, sans-serif;
  }

  .ig-feed__glow {
    position: absolute;
    inset: -20% -10% auto -10%;
    height: 480px;
    background:
      radial-gradient(circle at 18% 30%, rgba(204, 154, 68, 0.35), transparent 55%),
      radial-gradient(circle at 55% 15%, rgba(217, 117, 74, 0.22), transparent 50%),
      radial-gradient(circle at 82% 35%, rgba(51, 84, 76, 0.4), transparent 55%);
    filter: blur(30px);
    animation: ig-drift 14s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes ig-drift {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(18px) scale(1.05); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ig-feed__glow { animation: none; }
  }

  .ig-feed__header {
    position: relative;
    max-width: 1100px;
    margin: 0 auto 0.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .ig-feed__id {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  .ig-feed__avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--gold);
    background: var(--palm);
  }

  .ig-feed__id-text {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }

  .ig-feed__name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }

  .ig-feed__handle {
    font-size: 0.85rem;
    color: var(--ink-dim);
  }

  .ig-feed__cta {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--night-deep);
    background: var(--coral);
    padding: 0.6rem 1.1rem;
    border-radius: 999px;
    text-decoration: none;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .ig-feed__cta:hover {
    background: var(--gold);
    transform: translateY(-1px);
  }

  .ig-feed__cta:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .ig-feed__tag {
    position: relative;
    max-width: 1100px;
    margin: 0 auto 2rem;
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 1.6rem;
    color: var(--gold);
  }

  .ig-feed__grid {
    position: relative;
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.25rem;
    justify-items: center;
  }

  @media (max-width: 720px) {
    .ig-feed__grid { grid-template-columns: 1fr; }
  }

  .ig-feed__grid iframe {
    border-radius: 8px !important;
  }
</style>

<script>
  // ================================================================
  // GÖNDERİ LİNKLERİ — yeni paylaşım yaptığında buraya ekle
  // (en yeni gönderi en üstte olacak şekilde)
  // ================================================================
  const POST_LINKS = [
    "https://www.instagram.com/p/ÖRNEK_LINK_1/",
    "https://www.instagram.com/p/ÖRNEK_LINK_2/",
    "https://www.instagram.com/p/ÖRNEK_LINK_3/",
    "https://www.instagram.com/p/ÖRNEK_LINK_4/",
    "https://www.instagram.com/p/ÖRNEK_LINK_5/",
    "https://www.instagram.com/p/ÖRNEK_LINK_6/"
  ];

  const grid = document.getElementById("igGrid");

  POST_LINKS.forEach((link) => {
    const bq = document.createElement("blockquote");
    bq.className = "instagram-media";
    bq.setAttribute("data-instgrm-permalink", link);
    bq.setAttribute("data-instgrm-version", "14");
    bq.style.margin = "0";
    grid.appendChild(bq);
  });

  // Instagram'ın resmi embed script'ini yükle
  const s = document.createElement("script");
  s.async = true;
  s.src = "https://www.instagram.com/embed.js";
  document.body.appendChild(s);
</script>
